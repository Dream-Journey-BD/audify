<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="#292524" stroke-width="1.5" />
  
  <!-- Waveform & Sound Bars -->
  <rect x="12" y="24" width="4.5" height="16" rx="2.25" fill="url(#fav-grad)" opacity="0.65" />
  <rect x="20" y="16" width="4.5" height="32" rx="2.25" fill="url(#fav-grad)" opacity="0.85" />
  <rect x="28" y="10" width="5" height="44" rx="2.5" fill="url(#fav-grad)" />
  <rect x="36" y="18" width="4.5" height="28" rx="2.25" fill="url(#fav-grad)" opacity="0.9" />
  <rect x="44" y="22" width="4.5" height="20" rx="2.25" fill="url(#fav-grad)" opacity="0.75" />

  <!-- Center Master Dot Accent -->
  <circle cx="30.5" cy="32" r="1.75" fill="#FFFFFF" />
</svg>
