<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bg-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow-icon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-icon)" stroke="#27272A" stroke-width="8" />
  
  <!-- Subtle circular grid -->
  <circle cx="256" cy="256" r="210" stroke="#27272A" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="160" stroke="#27272A" stroke-width="2" stroke-dasharray="6 6" opacity="0.3" />

  <!-- Waveform Bars -->
  <rect x="96" y="200" width="32" height="112" rx="16" fill="url(#grad-icon)" opacity="0.65" />
  <rect x="152" y="144" width="32" height="224" rx="16" fill="url(#grad-icon)" opacity="0.8" />
  <rect x="208" y="96" width="36" height="320" rx="18" fill="url(#grad-icon)" filter="url(#glow-icon)" />
  <rect x="268" y="128" width="36" height="256" rx="18" fill="url(#grad-icon)" opacity="0.95" />
  <rect x="328" y="176" width="32" height="160" rx="16" fill="url(#grad-icon)" opacity="0.8" />
  <rect x="384" y="216" width="32" height="80" rx="16" fill="url(#grad-icon)" opacity="0.6" />

  <!-- Center Core Ring Indicator -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="28" stroke="#FDE68A" stroke-width="4" opacity="0.8" />
</svg>
